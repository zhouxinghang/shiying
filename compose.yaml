services:
  shiying:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    ports:
      - "8081:8080"
    environment:
      SHIYING_ACCESS_TOKEN: ${SHIYING_ACCESS_TOKEN:?请设置一个足够长的访问口令}
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  data:
